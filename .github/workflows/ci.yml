# CI do atta-app (MIG-01; ADR 0001). Um run por ref (o novo cancela o anterior). Jobs pesados (scripts/ci-filtro.sh):
# no PR, o banco roda quando o PR mexe no banco e o e2e quando mexe em tela (ou tem a etiqueta `e2e`); o lote da fila
# (lote/*) roda tudo; o push na main pula banco e e2e quando a árvore é a de um lote verde.
# Segurança: só leitura, actions por SHA, nada de ${{ }} dentro de `run`, nenhum segredo (o e2e usa valores fictícios).
# PR em rascunho não roda (cota): o CI começa quando o PR fica pronto para revisão. Passo de rede tem tempo-limite,
# para um espelho lento virar falha rápida e visível, nunca 13 min de espera (medição do DevEx em 20/11).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    # trem/** são os vagões do trem de merge (scripts/trem.sh): push roda a suíte inteira, sem filtro de caminho
    branches: [main, "trem/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mudancas:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # só leitura: o filtro lê as etiquetas do PR e os runs verdes dos lotes (token automático do run, sem segredo)
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      banco: ${{ steps.filtro.outputs.banco }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RAMO_PR: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-filtro.sh
      - name: testes do filtro do CI
        run: sh scripts/ci-filtro.test.sh
      - name: testes do trem.sh (apelidos e veredito dos revisores)
        run: bash scripts/trem.test.sh
      # versões das migrations, sem Supabase (pedido do TL em 20/11; ADR 0001 §3): nada repetido e, no PR (e no vagão do
      # trem), toda migration nova maior que a última da main. No PR, a árvore é a do PR já juntado com a main.
      - name: versões das migrations (únicas e maiores que a última da main)
        env:
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ATTA_PR: ${{ github.event.pull_request.number }}
        run: |
          case "$EVENTO:$REF" in
            pull_request:*) sh scripts/checa-migrations.sh origin/main "$HEAD_PR" ;;
            push:refs/heads/trem/*) sh scripts/checa-migrations.sh origin/main HEAD ;;
            *) sh scripts/checa-migrations.sh ;;
          esac
      - name: testes da checagem de migrations (date do GNU; no Mac, o do BSD)
        run: sh scripts/checa-migrations.test.sh

  vetores:
    name: vetores do ATTA Sign imutáveis
    # Cópia congelada dos vetores do atta-core (MIG-21): vetor existente não muda nem sai; o SHA256SUMS só ganha linha.
    # Mudança de cálculo nasce como atta_sign_v2 ao lado (README de tests/vectors/atta_sign_v1).
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mexidos="$(git diff --diff-filter=MDRT --name-only "$BASE...$HEAD" -- tests/vectors | grep -v -E '(README\.md|SHA256SUMS)$' || true)"
          if [ -n "$mexidos" ]; then echo "::error::vetor existente alterado ou removido:"; echo "$mexidos"; exit 1; fi
          if git diff -U0 "$BASE...$HEAD" -- tests/vectors/SHA256SUMS | grep -q -E '^-[^-]'; then
            echo "::error::tests/vectors/SHA256SUMS só pode ganhar linhas"; exit 1
          fi

  app:
    name: lint + typecheck + testes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (versão do packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  banco:
    name: banco (pgTAP + tipos gerados)
    needs: mudancas
    if: needs.mudancas.outputs.banco == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Supabase local (as migrations entram na subida)
        timeout-minutes: 5
        run: sh scripts/supabase-local.sh start
      - name: pgTAP (portões de RLS e do public, schemas)
        run: sh scripts/supabase-local.sh test
      - name: tipos gerados iguais ao src/lib/supabase/database.types.ts
        run: |
          sh scripts/supabase-local.sh types > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts" \
            || { echo "::error::rode 'ATTA_SIGLA=<sua> pnpm db types > src/lib/supabase/database.types.ts' e commite"; exit 1; }

  e2e:
    name: build + e2e com axe
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Chave mestra da rede e peppers de TESTE, fictícios e públicos (tests/fixtures/cofre-ci.ts), os mesmos com que o
    # seed de pacientes foi gerado (MIG-43): a porta real abre o contato e calcula o HMAC do CPF como na produção, que
    # usa as chaves da Vercel. Não são segredo; produção recusa esta KEK (CI_TEST_KEK_FINGERPRINT).
    env:
      ATTA_REDE_CHAVE_MESTRA: k1:617474612d6170702d63692d6b656b2d64652d74657374652d66696374696369
      ATTA_CPF_PEPPER: 617474612d6170702d63692d7065707065722d646f2d6370662d666963746963
      ATTA_RNE_PEPPER: 617474612d6170702d63692d7065707065722d646f2d726e652d666963746963
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # o painel exige login (MIG-03): o e2e entra nas pessoas fictícias do supabase/seed.sql, no Supabase local do runner.
      # O Supabase sobe em segundo plano enquanto o install e o navegador rodam; o build espera por ele (as variáveis
      # NEXT_PUBLIC_* entram no build).
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Supabase local em segundo plano (migrations e seed)
        run: |
          rm -f "$RUNNER_TEMP/supabase.rc"
          ( sh scripts/supabase-local.sh start; echo $? > "$RUNNER_TEMP/supabase.rc" ) > "$RUNNER_TEMP/supabase.log" 2>&1 &
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: versão do Playwright (chave do cache do navegador)
        id: playwright
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache do navegador do Playwright
        id: cache-navegador
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.versao }}
      # Sem --with-deps: a imagem ubuntu-24.04 já tem as bibliotecas do Chromium (traz o Google Chrome). O --with-deps só
      # acrescentava fontes CJK/tailandesas/xfonts pelo apt, e o espelho chegou a levar 10 min para 32 MB.
      - name: navegador do Playwright (só sem cache)
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: pnpm exec playwright install chromium
      - name: esperar o Supabase local e pôr as chaves locais no ambiente
        timeout-minutes: 5
        run: |
          while [ ! -f "$RUNNER_TEMP/supabase.rc" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase.log"
          [ "$(cat "$RUNNER_TEMP/supabase.rc")" = 0 ] || { echo "::error::o Supabase local não subiu"; exit 1; }
          sh scripts/supabase-local.sh env >> "$GITHUB_ENV"
      # Cofre 'network' no e2e (celulares do Fluxo alternativo, MIG-42): a KEK de TESTE, fictícia e pública, derivada da
      # fixture tests/fixtures/cofre-ci.ts (a produção recusa a impressão digital dela). Nenhuma chave real no CI.
      - name: KEK de teste do Cofre para o e2e
        run: echo "ATTA_REDE_CHAVE_MESTRA=k1:$(node -e "process.stdout.write(Buffer.from('atta-app-ci-kek-de-teste-ficticia','ascii').subarray(0,32).toString('hex'))")" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm test:e2e
      # e2e de produção (pedido do FE2 e do TL Frontend, 20/11): com VERCEL_ENV=production, as rotas com porta simulada
      # (check-in, Boarding Check, /b) dão 404. A guarda roda no build (prerender parcial), então é um build próprio,
      # depois do e2e normal e no mesmo job (aproveita o install, o navegador e o Supabase). Specs em e2e/producao/.
      - name: build de produção (VERCEL_ENV=production)
        env:
          VERCEL_ENV: production
        run: pnpm build
      - name: e2e de produção (rotas com porta simulada dão 404)
        run: pnpm test:e2e:producao

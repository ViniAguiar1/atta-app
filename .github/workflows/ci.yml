# CI do atta-app (MIG-01; ADR 0001). A cota do Actions é da conta pessoal do dono: um run por ref (o novo cancela o
# anterior) e os jobs pesados (banco e e2e) só rodam quando o PR mexe no que eles testam. Na main, roda tudo.
# Segurança: só leitura, actions por SHA, nada de ${{ }} dentro de `run`, nenhum segredo (o e2e usa valores fictícios).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mudancas:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      banco: ${{ steps.filtro.outputs.banco }}
      web: ${{ steps.filtro.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENTO" != pull_request ]; then
            { echo "banco=true"; echo "web=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos="$(git diff --name-only "$BASE...$HEAD")"
          marcar() { if echo "$arquivos" | grep -qE "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          marcar banco '^(supabase/|src/lib/supabase/database\.types\.ts$|scripts/supabase-local\.sh$|\.github/workflows/)'
          marcar web '^(src/|e2e/|public/|eslint-rules/|package\.json$|pnpm-lock\.yaml$|next\.config\.ts$|playwright\.config\.ts$|\.github/workflows/)'

  app:
    name: lint + typecheck + testes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (versão do packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  banco:
    name: banco (pgTAP + tipos gerados)
    needs: mudancas
    if: needs.mudancas.outputs.banco == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0
      - name: Supabase local (as migrations entram na subida)
        run: sh scripts/supabase-local.sh start
      - name: pgTAP (portões de RLS e do public, schemas)
        run: sh scripts/supabase-local.sh test
      - name: tipos gerados iguais ao src/lib/supabase/database.types.ts
        run: |
          sh scripts/supabase-local.sh types > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts" \
            || { echo "::error::rode 'ATTA_SIGLA=<sua> pnpm db types > src/lib/supabase/database.types.ts' e commite"; exit 1; }

  e2e:
    name: build + e2e com axe
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # valores fictícios: a página de saúde e a inicial não falam com o Supabase
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:43321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ficticia_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
